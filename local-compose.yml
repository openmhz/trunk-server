# Local development overlay: adds MinIO object storage to the test stack.
#
# Kept as a separate file (rather than edits to docker-compose.yml / test-compose.yml)
# so the local dev setup stays additive and does not conflict when rebasing on upstream.
# Applied by ./docker-local.sh.
services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - ${PWD}/data/minio:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      # proxy as well as node: nginx serves call audio through the
      # media.${DOMAIN_NAME} vhost and has to be able to reach MinIO.
      - node
      - proxy
    restart: always
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
    logging:
      driver: "json-file"
      options:
        tag: "minio"

  # One-shot: create the bucket and make sure it is NOT anonymously readable.
  # The backend now hands the player a gated redirect that presigns a
  # short-lived URL, so nothing needs public access. An anonymous download
  # policy would override every object ACL and make the listener gate
  # decorative, since the object keys are guessable.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/${S3_BUCKET} &&
      mc anonymous set download local/${S3_BUCKET} &&
      echo 'MinIO bucket ${S3_BUCKET} ready (public read - the audio urls are public, the API is gated)'
      "
    networks:
      - node
    restart: "no"
    logging:
      driver: "json-file"
      options:
        tag: "minio-init"

  # ---------------------------------------------------------------------------
  # Source bind mounts.
  #
  # test-compose.yml runs every Node service under nodemon, but the images
  # COPY the source in at build time and nothing is mounted, so nodemon only
  # ever watches a frozen copy - editing on the host does nothing until a
  # rebuild. These mounts make the host tree authoritative so nodemon actually
  # reloads on save.
  #
  # The bare paths (no host side) are anonymous volumes. They shadow the bind
  # mount for that one subpath, preserving artefacts that exist only inside the
  # image: node_modules, and the compiled React bundle in public/.
  # ---------------------------------------------------------------------------
  backend:
    # Not in the upstream environment list; needed so the S3 client talks
    # path-style to MinIO instead of virtual-host style.
    environment:
      - S3_FORCE_PATH_STYLE
      # Silences the endless OTLP connect-retry spam when no collector is running.
      - OTEL_SDK_DISABLED
    volumes:
      - ./backend:/home/app
      - /home/app/node_modules
      - /home/app/upload
    depends_on:
      - mongo
      - minio

  # Without this block the transcriber runs the code baked into the image and
  # local edits appear to do nothing - the same trap the other services hit.
  # Mirrors the backend's mounts because it is the same image.
  transcriber:
    environment:
      - S3_FORCE_PATH_STYLE
    volumes:
      - ./backend:/home/app
      - /home/app/node_modules
      - /home/app/upload
    logging:
      driver: "json-file"
      options:
        tag: "transcriber"

  account:
    volumes:
      - ./account/server:/app
      - /app/node_modules
      - /app/public

  admin:
    volumes:
      - ./admin/server:/app
      - /app/node_modules
      - /app/public

  # frontend needs per-file mounts rather than a directory mount: its Dockerfile
  # generates /app/index.ejs at build time and that file does not exist in the
  # repo, so mounting ./frontend/server over /app would hide it.
  frontend:
    volumes:
      - ./frontend/server/index.js:/app/index.js
      - ./frontend/server/db.js:/app/db.js
      - ./frontend/server/config:/app/config
      - ./frontend/server/card.ejs:/app/card.ejs
      - ./frontend/server/env.ejs:/app/env.ejs

  # Same syslog problem as certbot below: no syslog listener under Docker
  # Desktop, so the container refuses to start. app.py is bind-mounted so the
  # service can be edited and restarted without a rebuild - the model lives in
  # the image at /models and is deliberately not mounted.
  whisper:
    volumes:
      # A directory mount, not ./whisper/app.py:/app/app.py - Docker Desktop
      # invalidates a per-file bind mount when the file is edited through the
      # Windows path, and `docker restart` then fails to recreate the container.
      # Safe to mount over /app because nothing there is generated at build
      # time; the model lives at /models and is deliberately left in the image.
      - ./whisper:/app
    logging:
      driver: "json-file"
      options:
        tag: "whisper"

  # Upstream leaves certbot on the syslog log driver in every compose file,
  # including test-compose.yml. There is no syslog listener under Docker Desktop,
  # so the container fails to start. It has nothing to do locally anyway.
  certbot:
    logging:
      driver: "json-file"
      options:
        tag: "certbot"

networks:
  proxy:
  node:
