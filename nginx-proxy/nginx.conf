user  www-data;  
worker_processes  3; ## default is 1

pid        /var/run/nginx.pid;

events {
  worker_connections  4096;  ## Default: 1024
}


error_log /dev/stdout error;


http {  
    log_format  main  '$http_host '
      '$remote_addr '
      '"$request" $status $body_bytes_sent '
      '"$http_referer" "$http_user_agent" ';
    #access_log /dev/stdout main;
    #access_log    off;    

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Docker's embedded DNS. Without a resolver, nginx looks an upstream
    # hostname up once at config load and caches the address forever - so
    # recreating a container, which gives it a new IP, produces 502s with
    # "connection refused" against an address nothing is listening on any more,
    # until nginx is reloaded by hand. Paired with a variable in each proxy_pass
    # (which is what forces resolution to happen per request) upstreams are
    # re-resolved every 10 seconds instead.
    resolver 127.0.0.11 valid=10s ipv6=off;

    sendfile        on;
    keepalive_timeout  65;

    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/x-javascript
               text/xml application/xml application/xml+rss text/javascript;

    include /etc/nginx/conf.d/*.conf;
}

