user  www-data;  
worker_processes  auto;
worker_rlimit_nofile 65535;

pid        /var/run/nginx.pid;

events {
  worker_connections  16384;
}


error_log /dev/stdout error;


http {  
    log_format  main  '$http_host '
      '$remote_addr '
      '"$request" $status $body_bytes_sent '
      '"$http_referer" "$http_user_agent" ';
    # Default: no access log. Locations that want one say `access_log /dev/stdout main;`.
    # Without this, nginx's built-in default wrote everything else (mostly the
    # port-80 redirect) to /var/log/nginx/access.log, which is bind-mounted to
    # data/log/nginx, and it grew to ~1GB unrotated.
    access_log off;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    # application/javascript is how the React bundles are served (the old list
    # only had the legacy x-javascript name, so they went out uncompressed).
    gzip_types text/plain text/css application/json application/javascript application/x-javascript
               text/xml application/xml application/xml+rss text/javascript
               application/manifest+json image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
}

