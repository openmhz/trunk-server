# The app containers, looked up through Docker's DNS.
#
# nginx used to resolve these names only when it loaded its config, so after a
# deploy recreated a container (and Docker gave it a new IP) nginx kept sending
# traffic to the old address, which could now belong to a different app. On
# 2026-11-28 admin and account swapped IPs this way and both returned 502
# until the next reload.
#
# `resolve` (nginx 1.27.3+) re-resolves each name as its DNS record expires,
# using the resolver below. `zone` is required for it. nginx also starts if a
# name doesn't resolve yet (e.g. the app container isn't up) and picks it up
# once it does, instead of refusing to start.
#
# Included by the stage's site.template.

# Docker's DNS runs inside this container, so a short cache is free; it bounds
# how long nginx can keep using a recreated container's old address.
resolver 127.0.0.11 valid=2s ipv6=off;
resolver_timeout 5s;

upstream backend_api {
	zone backend_api 64k;
	server backend:3005 resolve;
	keepalive 64;
	keepalive_timeout 60s;
}

upstream frontend_app {
	zone frontend_app 64k;
	server frontend:3000 resolve;
}

upstream account_app {
	zone account_app 64k;
	server account:3009 resolve;
}

upstream admin_app {
	zone admin_app 64k;
	server admin:3008 resolve;
}
