version: "3"
services:
  nginx:
    build:
      context: ./nginx-proxy
      args:
        STAGE: ${STAGE}
    environment:
      - DOMAIN_NAME
    image: "nginx:${TAG}-${STAGE}"
    networks:
      - proxy
    ports:
      - "80:80"
      - "443:443"
      - "5602:5602"
    restart: always
    volumes:
      - ${PWD}/data/log/syslog:/var/log/syslog
      - ${PWD}/data/log/nginx:/var/log/nginx
      - ${PWD}/data/certbot/www/:/var/www/certbot/:ro
      - ${PWD}/data/certbot/conf/:/etc/letsencrypt/:ro
    depends_on:
      - backend
      - frontend 
      - account
      - admin
    command: /bin/bash -c "envsubst '$$DOMAIN_NAME' < /etc/nginx/conf.d/site.template > /etc/nginx/conf.d/default.conf && while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g 'daemon off;'"

  certbot:
    image: certbot/certbot:latest
    volumes:
      - ${PWD}/data/certbot/www/:/var/www/certbot/:rw
      - ${PWD}/data/certbot/conf/:/etc/letsencrypt/:rw
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    logging:
      driver: syslog
      options:
        tag: "certbot"

  mongo:
    build:
      context: ./mongo
    environment:
      - FREE_PLAN
      - PRO_PLAN
      - FREE_PLAN_ARCHIVE
      - PRO_PLAN_ARCHIVE
    image: "mongo:${TAG}-${STAGE}"
    volumes:
      - ${PWD}/data/mongo:/data/db
    networks:
      - node
    restart: always
    logging:
      driver: syslog
      options:
        tag: "mongo"

  backend:
    build:
      context: ./backend
    image: "backend:${TAG}-${STAGE}"
    pid: "host"
    environment:
      # Signs the session cookie. Must match account and admin exactly - the
      # backend reads the sessions they issue, it does not create its own.
      - SESSION_SECRET
      # Extra browser origins allowed to send the session cookie, comma
      # separated - e.g. a LAN IP used during local development.
      - EXTRA_CORS_ORIGINS
      # Defaults to disabled: otel-tracing.js starts the SDK unconditionally at
      # require time, so without this the OTel stack is live (and parsing the
      # baggage/traceparent headers off every public request) even with no
      # collector configured. Set OTEL_SDK_DISABLED=false to turn tracing on.
      - OTEL_SDK_DISABLED=${OTEL_SDK_DISABLED:-true}
      - OTEL_EXPORTER_OTLP_PROTOCOL
      - OTEL_EXPORTER_OTLP_ENDPOINT
      - OTEL_EXPORTER_OTLP_HEADERS
      - OTEL_SERVICE_NAME
      - MONGO_HOST
      - MONGO_PORT
      - MONGO_USER
      - MONGO_PASSWORD
      - MAILJET_KEY
      - MAILJET_SECRET
      - REACT_APP_ADMIN_EMAIL
      - REACT_APP_SITE_NAME
      - NODE_ENV
      - REACT_APP_BACKEND_SERVER
      - REACT_APP_ADMIN_SERVER
      - REACT_APP_FRONTEND_SERVER
      - REACT_APP_ACCOUNT_SERVER
      - S3_ENDPOINT
      - S3_BUCKET
      - S3_PROFILE
      - S3_REGION
      - S3_PUBLIC_URL
      - HONEYCOMB_API_KEY
    volumes:
      - "~/.aws:/home/app/.aws"
      - ${PWD}/data/stats:/data/stats
    depends_on:
      - mongo
    ports:
      # Loopback only. nginx reaches the backend over the "proxy" network as
      # http://backend:3005, so publishing this on 0.0.0.0 only exposes a route
      # around nginx (and around ufw, since docker writes its own iptables rules).
      - "127.0.0.1:3005:3005"
    networks:
      - node
      - proxy
    restart: always
    logging:
      driver: syslog
      options:
        tag: "backend"

  admin:
    build:
      context: ./admin
      args:
        - REACT_APP_BACKEND_SERVER
        - REACT_APP_ADMIN_SERVER
        - REACT_APP_ACCOUNT_SERVER
        - REACT_APP_FRONTEND_SERVER
        - REACT_APP_SITE_NAME
        - REACT_APP_ADMIN_EMAIL
        - NODE_ENV
    image: "admin:${TAG}-${STAGE}"
    environment:
      # Must match the account service exactly - see the note there.
      - SESSION_SECRET
      - REACT_APP_BACKEND_SERVER
      - REACT_APP_ADMIN_SERVER
      - REACT_APP_ACCOUNT_SERVER
      - REACT_APP_FRONTEND_SERVER
      - REACT_APP_SITE_NAME
      - MONGO_HOST
      - MONGO_PORT
      - MONGO_USER
      - MONGO_PASSWORD
      - NODE_ENV
    depends_on:
      - mongo
    networks:
      - node
      - proxy
    restart: always
    logging:
      driver: syslog
      options:
        tag: "admin"

  account:
    build:
      context: ./account
      args:
        - REACT_APP_BACKEND_SERVER
        - REACT_APP_ADMIN_SERVER
        - REACT_APP_ACCOUNT_SERVER
        - REACT_APP_FRONTEND_SERVER
        - REACT_APP_SITE_NAME
        - REACT_APP_ADMIN_EMAIL
        - NODE_ENV
    image: "acount:${TAG}-${STAGE}"
    environment:
      # Signs the session cookie. Must match admin (and later backend) exactly,
      # or the services cannot read each other's sessions.
      - SESSION_SECRET
      - MONGO_HOST
      - MONGO_PORT
      - MONGO_USER
      - MONGO_PASSWORD
      - MAILJET_KEY
      - MAILJET_SECRET
      - REACT_APP_BACKEND_SERVER
      - REACT_APP_ADMIN_SERVER
      - REACT_APP_ACCOUNT_SERVER
      - REACT_APP_FRONTEND_SERVER
      - REACT_APP_SITE_NAME
      - REACT_APP_ADMIN_EMAIL
      - REACT_APP_COOKIE_DOMAIN
      - NODE_ENV
    depends_on:
      - mongo
    networks:
      - node
      - proxy
    restart: always
    logging:
      driver: syslog
      options:
        tag: "account"

  frontend:
    build:
      context: ./frontend
      args:
        - REACT_APP_BACKEND_SERVER
        - REACT_APP_FRONTEND_SERVER
        - REACT_APP_ACCOUNT_SERVER
        - REACT_APP_SITE_NAME
        - REACT_APP_GOOGLE_ANALYTICS
        - NODE_ENV
    image: "frontend:${TAG}-${STAGE}"
    environment:
        - MONGO_NODE_DRIVER_HOST=mongo
        - REACT_APP_BACKEND_SERVER
        - REACT_APP_FRONTEND_SERVER
        - REACT_APP_ACCOUNT_SERVER
        - REACT_APP_SITE_NAME
        - REACT_APP_GOOGLE_ANALYTICS
        - GLIBC_TUNABLES=glibc.pthread.rseq=0
    ulimits:
      memlock: -1
    depends_on:
      - mongo
    networks:
      - node
      - proxy
    restart: always
    logging:
      driver: syslog
      options:
        tag: "frontend"

  # Claims calls waiting for transcription and feeds them to whisper.
  #
  # Same build context and image as the backend - one image, one lockfile, just
  # a different command. It runs as its own process so that a multi-second
  # transcription never shares an event loop with call ingest or the read API.
  transcriber:
    build:
      context: ./backend
    image: "backend:${TAG}-${STAGE}"
    command: node transcribe-worker.js
    environment:
      - MONGO_HOST
      - MONGO_PORT
      - MONGO_USER
      - MONGO_PASSWORD
      - MONGO_NODE_DRIVER_HOST
      - MONGO_NODE_DRIVER_PORT
      - S3_ENDPOINT
      - S3_BUCKET
      - S3_PROFILE
      - S3_REGION
      - S3_FORCE_PATH_STYLE
      - WHISPER_URL
      - TRANSCRIBE_POLL_MS
      - TRANSCRIBE_MAX_ATTEMPTS
      - TRANSCRIBE_CLAIM_TTL_MS
      - TRANSCRIBE_MAX_AGE_MS
      - TRANSCRIBE_BREAKER_MS
      - TRANSCRIBE_TIMEOUT_MS
      - NODE_ENV
    volumes:
      - "~/.aws:/home/app/.aws"
    depends_on:
      - mongo
      - whisper
    networks:
      - node
    restart: always
    logging:
      driver: syslog
      options:
        tag: "transcriber"

  # Speech-to-text for call audio. Self-hosted, so no audio ever leaves the
  # server and a transcript costs nothing per call.
  #
  # Deliberately on the "node" network only, with no published port and no
  # nginx vhost: this service has no authentication of its own, and anything
  # that can reach it can transcribe arbitrary audio on your CPU.
  whisper:
    build:
      context: ./whisper
      args:
        - WHISPER_MODEL=${WHISPER_MODEL:-small.en}
    image: "whisper:${TAG}-${STAGE}"
    environment:
      - WHISPER_MODEL=${WHISPER_MODEL:-small.en}
      - WHISPER_MAX_SECONDS
      - WHISPER_MIN_SECONDS
      - WHISPER_MIN_AVG_LOGPROB
      - WHISPER_PROMPT
    # Whisper is the only thing here that can eat a whole core and a gigabyte.
    # Capped so a burst of long calls cannot starve mongo or the backend.
    mem_limit: 2g
    cpus: "1.5"
    networks:
      - node
    restart: always
    logging:
      driver: syslog
      options:
        tag: "whisper"

networks:
  proxy:
  node:
