name: Tests

on:
  pull_request:
  push:
    branches: [ "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
    env:
      TEST_MONGO_HOST: 127.0.0.1
      TEST_MONGO_PORT: "27017"
      TEST_MONGO_URL: mongodb://127.0.0.1:27017/ci_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Fails if package-lock.json is out of date with any package.json.
      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Test
        run: npm test

      - name: Check the database scripts parse
        run: |
          bash -n mongo/db.sh
          bash -n mongo/backup.sh
          node --check mongo/scripts/maintain.js

  # nginx exits at startup if its config is invalid, which takes every site
  # down, so check both stages' configs on every change.
  nginx-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the prod and test nginx configs
        run: |
          set -e
          mkdir -p le/live/openmhz.test
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 -subj "/CN=openmhz.test" \
            -keyout le/live/openmhz.test/privkey.pem -out le/live/openmhz.test/fullchain.pem 2>/dev/null
          docker network create nginx-check
          for stage in prod test; do
            docker build -q --build-arg STAGE=$stage -t nginx-check:$stage nginx-proxy >/dev/null
            docker run --rm --network nginx-check -e DOMAIN_NAME=openmhz.test \
              -v "$PWD/le:/etc/letsencrypt:ro" --entrypoint sh nginx-check:$stage -c \
              'envsubst "\$DOMAIN_NAME" < /etc/nginx/conf.d/site.template > /etc/nginx/conf.d/default.conf && nginx -t'
            echo "$stage config OK"
          done

  # The production, test and development stacks must all be valid compose
  # configs; a broken override would otherwise only show up on a server.
  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check each stage's compose files
        run: |
          set -e
          COMPOSE_FILE=compose.yaml docker compose --env-file prod.env.example config --quiet
          COMPOSE_FILE=compose.yaml:compose.test.yaml docker compose --env-file test.env.example config --quiet
          COMPOSE_FILE=compose.yaml:compose.test.yaml:compose.dev.yaml docker compose --env-file test.env.example config --quiet
          COMPOSE_FILE=compose.yaml:compose.registry.yaml docker compose --env-file prod.env.example config --quiet
          echo "production (build and registry), test and development configs are valid"
