# OpenMHz, production. This file on its own is the production stack.
#
#   production:   COMPOSE_FILE=compose.yaml
#   local test:   COMPOSE_FILE=compose.yaml:compose.test.yaml
#   development:  COMPOSE_FILE=compose.yaml:compose.test.yaml:compose.dev.yaml
#
# Put COMPOSE_FILE and the settings in an env file named .env next to this file
# (start from prod.env.example or test.env.example), and every `docker compose`
# command picks them up. See "Running the stack" in the README.

services:
  nginx:
    build:
      context: ./nginx-proxy
      args:
        STAGE: ${STAGE}
    environment:
      - DOMAIN_NAME
    image: "nginx:${TAG}-${STAGE}"
    networks:
      - proxy
    ports:
      - "80:80"
      - "443:443"
    restart: always
    # nginx logs to the container's stdout; cap it so it can't fill the disk.
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    volumes:
      - ./data/log/syslog:/var/log/syslog
      - ./data/log/nginx:/var/log/nginx
      - ./data/certbot/www/:/var/www/certbot/:ro
      - ./data/certbot/conf/:/etc/letsencrypt/:ro
    depends_on:
      - backend
      - frontend 
      - account
      - admin

  certbot:
    image: certbot/certbot:latest
    volumes:
      - ./data/certbot/www/:/var/www/certbot/:rw
      - ./data/certbot/conf/:/etc/letsencrypt/:rw
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    logging:
      driver: syslog
      options:
        tag: "certbot"

  mongo:
    build:
      context: ./mongo
    environment:
      - FREE_PLAN
      - PRO_PLAN
      - FREE_PLAN_ARCHIVE
      - PRO_PLAN_ARCHIVE
    image: "mongo:${TAG}-${STAGE}"
    volumes:
      - ./data/mongo:/data/db
    networks:
      - node
    # Reachable from the host only (for mongosh/backups), never from outside.
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: always
    logging:
      driver: syslog
      options:
        tag: "mongo"

  backend:
    build:
      # Repo root: the image installs from the root package-lock.json.
      context: .
      dockerfile: backend/Dockerfile
    image: "backend:${TAG}-${STAGE}"
    pid: "host"
    environment:
      - OTEL_EXPORTER_OTLP_PROTOCOL
      - OTEL_EXPORTER_OTLP_ENDPOINT
      - OTEL_EXPORTER_OTLP_HEADERS
      - OTEL_SERVICE_NAME
      - MONGO_HOST
      - MONGO_PORT
      - MONGO_USER
      - MONGO_PASSWORD
      - MAILJET_KEY
      - MAILJET_SECRET
      - FIREHOSE_KEY
      - REACT_APP_ADMIN_EMAIL
      - REACT_APP_SITE_NAME
      - NODE_ENV
      - REACT_APP_BACKEND_SERVER
      - REACT_APP_ADMIN_SERVER
      - REACT_APP_FRONTEND_SERVER
      - REACT_APP_ACCOUNT_SERVER
      - S3_ENDPOINT
      - S3_BUCKET
      - S3_PROFILE
      - S3_REGION
      - S3_PUBLIC_URL
      - HONEYCOMB_API_KEY
    volumes:
      - "~/.aws:/home/app/.aws"
      - ./data/stats:/data/stats
    healthcheck:
      # Any answer from the app counts; a 5xx or no answer does not.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3005/stats').then(r => process.exit(r.status < 500 ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "3005:3005"
    networks:
      - node
      - proxy
    restart: always
    logging:
      driver: syslog
      options:
        tag: "backend"

  admin:
    build:
      # Repo root: the image installs from the root package-lock.json.
      context: .
      dockerfile: admin/Dockerfile
      args:
        - REACT_APP_BACKEND_SERVER
        - REACT_APP_ADMIN_SERVER
        - REACT_APP_ACCOUNT_SERVER
        - REACT_APP_FRONTEND_SERVER
        - REACT_APP_SITE_NAME
        - REACT_APP_ADMIN_EMAIL
        - NODE_ENV
    image: "admin:${TAG}-${STAGE}"
    environment:
      - REACT_APP_BACKEND_SERVER
      - REACT_APP_ADMIN_SERVER
      - REACT_APP_ACCOUNT_SERVER
      - REACT_APP_FRONTEND_SERVER
      - REACT_APP_SITE_NAME
      - MONGO_HOST
      - MONGO_PORT
      - MONGO_USER
      - MONGO_PASSWORD
      - SESSION_SECRET
      - NODE_ENV
    healthcheck:
      # Any answer from the app counts; a 5xx or no answer does not.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3008/').then(r => process.exit(r.status < 500 ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - node
      - proxy
    restart: always
    logging:
      driver: syslog
      options:
        tag: "admin"

  account:
    build:
      # Repo root: the image installs from the root package-lock.json.
      context: .
      dockerfile: account/Dockerfile
      args:
        - REACT_APP_BACKEND_SERVER
        - REACT_APP_ADMIN_SERVER
        - REACT_APP_ACCOUNT_SERVER
        - REACT_APP_FRONTEND_SERVER
        - REACT_APP_SITE_NAME
        - REACT_APP_ADMIN_EMAIL
        - NODE_ENV
    image: "acount:${TAG}-${STAGE}"
    environment:
      - MONGO_HOST
      - MONGO_PORT
      - MONGO_USER
      - MONGO_PASSWORD
      - SESSION_SECRET
      - MAILJET_KEY
      - MAILJET_SECRET
      - REACT_APP_BACKEND_SERVER
      - REACT_APP_ADMIN_SERVER
      - REACT_APP_ACCOUNT_SERVER
      - REACT_APP_FRONTEND_SERVER
      - REACT_APP_SITE_NAME
      - REACT_APP_ADMIN_EMAIL
      - REACT_APP_COOKIE_DOMAIN
      - NODE_ENV
    healthcheck:
      # Any answer from the app counts; a 5xx or no answer does not.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3009/authenticated').then(r => process.exit(r.status < 500 ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - node
      - proxy
    restart: always
    logging:
      driver: syslog
      options:
        tag: "account"

  frontend:
    build:
      # Repo root: the image installs from the root package-lock.json.
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - REACT_APP_BACKEND_SERVER
        - REACT_APP_FRONTEND_SERVER
        - REACT_APP_SITE_NAME
        - REACT_APP_GOOGLE_ANALYTICS
        - REACT_APP_ARCHIVE_DAYS
        - NODE_ENV
    image: "frontend:${TAG}-${STAGE}"
    environment:
        - MONGO_NODE_DRIVER_HOST=mongo
        - REACT_APP_BACKEND_SERVER
        - REACT_APP_FRONTEND_SERVER
        - REACT_APP_SITE_NAME
        - REACT_APP_GOOGLE_ANALYTICS
        - GLIBC_TUNABLES=glibc.pthread.rseq=0
    ulimits:
      memlock: -1
    healthcheck:
      # Any answer from the app counts; a 5xx or no answer does not.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.status < 500 ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - node
      - proxy
    restart: always
    logging:
      driver: syslog
      options:
        tag: "frontend"

networks:
  proxy:
  node:
